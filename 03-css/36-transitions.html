<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00- Template</title>
    <link rel="stylesheet" href="/src/css/03-css.css">
    <style>
        section img {
            display: block;
            margin: 1rem auto;
        }

        img.trans1 {
            transition: transform 0.5s ease-in;
        }

        img.trans1:hover {
            transform: scale(0.5);
        }

        img.trans2 {
            transition: transform 1s ease-out;
        }

        img.trans2:hover {
            transform: rotate(-180deg);
        }

        img.trans3 {
            transition: all 1s ease-in-out;
        }

        img.trans3:hover {
            transform: rotateY(720deg);
        }

        img.trans4 {
            transition: all 0.5s linear;
        }

        img.trans4:hover {
            transform: translateX(100px);
        }

        img.trans5 {
            transition: transform 1s,
                                width 1s 1s;
        }

        img.trans5:hover {
            transform: translateX(90px);
            width: 100px;  
            height: 50px;                  
        }
    </style>
</head>
<body class="css">
    <nav>
        <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    </nav>
    <main>
        <header>
          <h1>TRANSITIONS</h1>
          <h2>Permite definir una transición entre dos estados del elemento.</h2>
        </header>
        <section>
            <h3>Example 01</h3>
            <img src="./imgs/dk.png" width="180px" class="trans1">
            <h3>Example 02</h3>
            <img src="./imgs/dk.png" width="180px" class="trans2">
            <h3>Example 03</h3>
            <img src="./imgs/dk.png" width="180px" class="trans3">
            <h3>Example 04</h3>
            <img src="./imgs/dk.png" width="180px" class="trans4">
            <h3>Example 05</h3>
            <img src="./imgs/dk.png" width="180px" class="trans5"> 
       </section>
    </main>
</body>
</html>
